[project]
name = "jobstream-processor"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "confluent-kafka>=2.15.0",
    "psycopg2-binary>=2.9.12",
    "jobstream-common",
]

[tool.uv.sources]
jobstream-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/processor"]
