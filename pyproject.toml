[project]
name = "jobstream"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "confluent-kafka>=2.15.0",
    "playwright>=1.54.0",
    "python-dotenv>=1.2.2",
    "jobstream-collector",
    "jobstream-common",
    "apache-airflow==2.9.3",
]

[tool.uv.workspace]
members = ["apps/collector", "apps/processor", "packages/common"]

[tool.uv.sources]
jobstream-collector = { workspace = true }
jobstream-processor = { workspace = true }
jobstream-common = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
