# JobStream 로컬 인프라
# 실행: docker compose up -d
# 종료: docker compose down        (데이터 유지)
#       docker compose down -v     (데이터까지 초기화)
#
# Airflow 최초 실행 시:
#   1) docker compose up airflow-init   (DB 마이그레이션 + admin 계정 생성, 1회만)
#   2) docker compose up -d             (전체 서비스 기동)
#   3) http://localhost:8081  (기본 계정 airflow / airflow)

services:

  # ── Kafka (KRaft 모드 — Zookeeper 없음) ─────────────────────────
  kafka:
    image: apache/kafka:3.8.0
    container_name: jobstream-kafka
    ports:
      - "9092:9092"   # 호스트(내 노트북의 Python 코드)에서 접속하는 포트
    environment:
      # KRaft: 브로커 + 컨트롤러를 한 노드가 겸임 (로컬 개발용 단일 노드)
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093

      # 리스너 3개:
      #  - PLAINTEXT(29092)      : 도커 네트워크 내부용 (컨테이너끼리)
      #  - PLAINTEXT_HOST(9092)  : 호스트용 (localhost:9092 로 접속)
      #  - CONTROLLER(29093)     : KRaft 컨트롤러 통신용
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://kafka:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      # 단일 노드라 복제 계수 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      # 개발 편의: 토픽 자동 생성 허용 (운영에선 false 권장 — ADR 거리)
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 5

  # ── Kafka UI (토픽/메시지 눈으로 확인 — 학습에 큰 도움) ─────────
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: jobstream-kafka-ui
    ports:
      - "8080:8080"   # http://localhost:8080
    environment:
      KAFKA_CLUSTERS_0_NAME: jobstream-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy

  # ── Redis (dedup / rate limiter) ────────────────────────────────
  redis:
    image: redis:7.4-alpine
    container_name: jobstream-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes   # 재시작해도 dedup 상태 유지
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── PostgreSQL (+pgvector — 2개월차 벡터 검색 대비 미리 포함) ──
  postgres:
    image: pgvector/pgvector:pg16
    container_name: jobstream-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jobstream}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jobstream-dev}   # .env 로 덮어쓰기
      POSTGRES_DB: ${POSTGRES_DB:-jobstream}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jobstream}"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Airflow 메타데이터 DB (앱 postgres와 완전히 분리된 별도 인스턴스) ──
  airflow-postgres:
    image: postgres:16-alpine
    container_name: jobstream-airflow-postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Airflow 초기화 (DB migrate + admin 계정 생성, 1회성) ───────
  # 사용법: docker compose up airflow-init  (webserver/scheduler보다 먼저 1번 실행)
  airflow-init:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    image: jobstream-airflow:local
    container_name: jobstream-airflow-init
    depends_on:
      airflow-postgres:
        condition: service_healthy
    environment: &airflow-common-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DEFAULT_TIMEZONE: Asia/Seoul
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"

      # ── run_crawler 태스크(collector.producer)가 컨테이너 네트워크 안에서 Kafka에 붙기 위한 주소 ──
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092

      # ── check_data_quality 태스크가 jobstream 데이터 postgres에 붙기 위한 접속 정보 (.env 값과 동일하게) ──
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-jobstream}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jobstream-dev}
      POSTGRES_DB: ${POSTGRES_DB:-jobstream}

      # ── 이메일 알림 (Gmail 기준, .env 에 실제 값 설정) ──
      AIRFLOW__SMTP__SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      AIRFLOW__SMTP__SMTP_PORT: ${SMTP_PORT:-587}
      AIRFLOW__SMTP__SMTP_STARTTLS: "true"
      AIRFLOW__SMTP__SMTP_SSL: "false"
      AIRFLOW__SMTP__SMTP_USER: ${SMTP_USER:-}
      AIRFLOW__SMTP__SMTP_PASSWORD: ${SMTP_PASSWORD:-}   # Gmail 앱 비밀번호 (일반 로그인 비번 아님)
      AIRFLOW__SMTP__SMTP_MAIL_FROM: ${SMTP_USER:-}
      NOTIFY_EMAIL: ${NOTIFY_EMAIL:-}                    # 알림 받을 이메일
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username airflow --password airflow \
          --firstname bibi --lastname jobstream \
          --role Admin --email admin@jobstream.local || true

  # ── Airflow Webserver (UI: http://localhost:8081) ──────────────
  airflow-webserver:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    image: jobstream-airflow:local
    container_name: jobstream-airflow-webserver
    restart: unless-stopped
    depends_on:
      airflow-postgres:
        condition: service_healthy
    environment:
      <<: *airflow-common-env
    ports:
      - "8081:8080"   # 8080은 kafka-ui가 이미 사용 중이라 8081로 배정
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
    command: webserver
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ── Airflow Scheduler (크롤러 DAG / 임베딩 재학습 DAG 실행) ────
  airflow-scheduler:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    image: jobstream-airflow:local
    container_name: jobstream-airflow-scheduler
    restart: unless-stopped
    depends_on:
      airflow-postgres:
        condition: service_healthy
    environment:
      <<: *airflow-common-env
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
    command: scheduler

volumes:
  kafka-data:
  redis-data:
  postgres-data:
  airflow-postgres-data: